<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="register-page">

        
        <section class="register-image-section">

            <img
                src="assets/welcome.jpg"
                alt="Welcome"
                class="register-image"
            >

            <div class="register-image-overlay"></div>

            <div class="register-image-text">

                <span>WELCOME</span>

                <h2>
                    Your space.
                    <br>
                    Your profile.
                </h2>

            </div>

        </section>


        
        <section class="register-content-section">

            <a
                href="index.html"
                class="register-brand"
            >
                Account<span>.</span>
            </a>


            <div class="register-content">

                <div class="register-card">

                    <div class="register-heading">

                        <span>
                            GET STARTED
                        </span>

                        <h1>
                            Create your account
                        </h1>

                        <p>
                            Register to manage your profile.
                        </p>

                    </div>


                    <div id="registerMessage"></div>


                    <form id="registerForm">

                        <div class="register-field">

                            <label for="name">
                                Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="Enter your name"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <div class="register-field">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <div class="register-field">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn register-submit"
                        >
                            Create account
                        </button>

                    </form>


                    <p class="register-login-text">
                        Already have an account?
                        <a href="login.html">
                            Sign in
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="js/register.js"></script>


    <div 
    id="registerToast" 
    class="toast position-fixed top-0 end-0 m-4" 
    role="alert" 
    aria-live="assertive" 
    aria-atomic="true"
>
    <div class="toast-body" id="registerToastMessage"></div>
</div>

</body>
</html>
